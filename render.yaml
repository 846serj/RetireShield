services:
  - type: web
    name: retireshield
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_BASE_URL
        value: https://RetireShield.com
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: BENEFITS_CHECKLIST_STRIPE_TAX_ENABLED
        value: true
      - key: BENEFITS_CHECKLIST_STORAGE_BUCKET
        value: retire-shield-products
      - key: BENEFITS_CHECKLIST_DOWNLOADS_READY
        sync: false
      - key: BENEFITS_CHECKLIST_STATE_PACKS_READY
        sync: false
      - key: BENEFITS_REPORT_INTAKE_READY
        sync: false
      - key: BENEFITS_REPORT_NOTIFY_EMAIL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: live
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        value: ellen@retireshield.com
      - key: BEEHIIV_API_KEY
        sync: false
      - key: BEEHIIV_PUBLICATION_ID
        sync: false

  - type: cron
    name: retireshield-benefits-fulfillment
    runtime: node
    plan: free
    schedule: "*/15 * * * *"
    buildCommand: npm ci && npm run build
    startCommand: 'curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" $NEXT_PUBLIC_BASE_URL/api/cron/benefits-fulfillment'
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_BASE_URL
        value: https://RetireShield.com
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: retireshield-monthly-rescore
    runtime: node
    plan: free
    schedule: "0 15 1 * *"
    buildCommand: npm ci && npm run build
    startCommand: 'curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" $NEXT_PUBLIC_BASE_URL/api/cron/monthly-rescore'
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_BASE_URL
        value: https://RetireShield.com

  - type: cron
    name: retireshield-daily-fraud-check
    runtime: node
    plan: free
    schedule: "0 14 * * *"
    buildCommand: npm ci && npm run build
    startCommand: 'curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" $NEXT_PUBLIC_BASE_URL/api/cron/daily-fraud-check'
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_BASE_URL
        value: https://RetireShield.com
